<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>新标签页</title>
<style>
  :root {
    --bg: #ECECEC;
    --panel: #F5F5F7;
    --text: #1D1D1F;
    --subtext: #86868B;
    --accent: #007AFF;
    --border: #D2D2D7;
    --on-accent: #FFFFFF;
    --radius: 8px;
    --panel-radius: 10px;
  }
  /* __THEME_VARS__ */
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    font: 16px system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  form { display: flex; gap: 8px; width: min(640px, 80vw); }
  input {
    flex: 1; padding: 14px 16px; border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text); font-size: 16px; outline: none;
  }
  input::placeholder { color: var(--subtext); }
  input:focus { border-color: var(--accent); }
  button {
    padding: 0 18px; border-radius: var(--radius); border: 0;
    background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(0.95); }
  h1 { font-weight: 600; letter-spacing: -0.02em; margin-bottom: 24px; }
</style>
</head>
<body>
  <main style="text-align:center">
    <h1>PureBrowser</h1>
    <form onsubmit="event.preventDefault(); const q=this.q.value.trim();
      if(!q) return false;
      location.href = q.includes('.') && !q.includes(' ')
        ? (q.includes('://') ? q : 'https://' + q)
        : 'https://cn.bing.com/search?q=' + encodeURIComponent(q);
      return false;">
      <input name="q" autofocus placeholder="使用 Bing 搜索或输入网址" autocomplete="off">
      <button type="submit">搜索</button>
    </form>
  </main>
</body>
</html>
